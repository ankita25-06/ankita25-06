name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:        # manual trigger button
  push:
    branches: [main]       # also runs when you push to this profile repo

permissions:
  contents: write          # lets the bot push the generated SVGs

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib-svg
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-settings.json
      - name: Commit & Push changes
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A .
          git commit -m "generated 3d contribution graph" || exit 0
          git push
